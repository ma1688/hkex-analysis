version: '3.8'

services:
  # ClickHouse数据库
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: hkex-clickhouse
    environment:
      CLICKHOUSE_DB: hkex_analysis
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d
    ports:
      - "8123:8123"
      - "9000:9000"
    networks:
      - hkex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 港股分析应用 - Web界面
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hkex-web
    environment:
      # 应用环境
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      APP_LOG_LEVEL: INFO

      # 数据库配置（指向docker-compose中的ClickHouse）
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: hkex_analysis
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_POOL_SIZE: 10

      # LLM配置（需要从.env或环境变量获取）
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_FAST_MODEL: ${SILICONFLOW_FAST_MODEL:-deepseek-ai/DeepSeek-V3}
      SILICONFLOW_STRONG_MODEL: ${SILICONFLOW_STRONG_MODEL:-Qwen/Qwen2.5-72B-Instruct}

      # OpenAI备选配置
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

      # 记忆配置
      MEMORY_STORE_BACKEND: memory
      MEMORY_MAX_MESSAGES: 100

      # LangSmith追踪（可选）
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-hkex-analysis}

      # 性能配置
      MAX_CONCURRENT_TOOLS: 5
      TOOL_TIMEOUT: 30
      AGENT_MAX_ITERATIONS: 10
    ports:
      - "8080:8080"
    volumes:
      - app_uploads:/app/src/web/static/uploads
    networks:
      - hkex-network
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 港股分析应用 - API服务
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hkex-api
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # 应用环境
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_LOG_LEVEL: INFO

      # 数据库配置
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: hkex_analysis
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_POOL_SIZE: 10

      # LLM配置
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_FAST_MODEL: ${SILICONFLOW_FAST_MODEL:-deepseek-ai/DeepSeek-V3}
      SILICONFLOW_STRONG_MODEL: ${SILICONFLOW_STRONG_MODEL:-Qwen/Q2.5-72B-Instruct}

      # OpenAI备选配置
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

      # 记忆配置
      MEMORY_STORE_BACKEND: memory
      MEMORY_MAX_MESSAGES: 100

      # LangSmith追踪（可选）
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-hkex-analysis}

      # 性能配置
      MAX_CONCURRENT_TOOLS: 5
      TOOL_TIMEOUT: 30
      AGENT_MAX_ITERATIONS: 10
    ports:
      - "8000:8000"
    networks:
      - hkex-network
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  clickhouse_data:
    driver: local
  clickhouse_logs:
    driver: local
  app_uploads:
    driver: local

networks:
  hkex-network:
    driver: bridge
